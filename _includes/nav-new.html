{%- assign nav_url = page.url -%}
<header class="nav" id="site-nav">
    <div class="nav-inner">
        <a href="{{ site.baseurl }}/" class="nav-brand" aria-label="{{ site.title }} · {{ site.author_en }}">
            <img class="brand-logo brand-logo-light" src="{{ '/img/brand/northcity-logo.webp' | relative_url }}" alt="NorthCity" width="491" height="96">
            <img class="brand-logo brand-logo-dark" src="{{ '/img/brand/northcity-logo-dark.webp' | relative_url }}" alt="NorthCity" width="517" height="96">
        </a>

        <nav class="nav-links" id="nav-links" aria-label="主导航 / Main">
            <a href="{{ site.baseurl }}/products/" {% if nav_url contains '/products' %}aria-current="page"{% endif %}><span data-lang-show="zh">作品</span><span data-lang-show="en">Work</span></a>
            <a href="{{ site.baseurl }}/essays/" {% if nav_url contains '/essays' or nav_url contains '/logs' or page.layout == 'post' or page.layout == 'article' %}aria-current="page"{% endif %}><span data-lang-show="zh">文章</span><span data-lang-show="en">Writing</span></a>
            <a href="{{ site.baseurl }}/about/" {% if nav_url contains '/about' or nav_url contains '/connect' %}aria-current="page"{% endif %}><span data-lang-show="zh">关于</span><span data-lang-show="en">About</span></a>
        </nav>

        <div class="nav-tools">
            <button id="lang-toggle" class="tool-btn tool-lang" type="button" aria-label="Switch to English"><span>EN</span></button>
            <button id="theme-toggle" class="tool-btn" type="button" aria-label="切换暗色模式">
                <span class="theme-icon theme-icon-moon">{% include icon.html name="moon" %}</span>
                <span class="theme-icon theme-icon-sun">{% include icon.html name="sun" %}</span>
            </button>
            <a class="nav-cta" href="{{ site.baseurl }}/connect/"><span data-lang-show="zh">联系</span><span data-lang-show="en">Contact</span></a>
            <button class="tool-btn nav-toggle" type="button" aria-label="打开导航 / Menu" aria-expanded="false" aria-controls="nav-links">{% include icon.html name="menu" %}</button>
        </div>
    </div>
</header>
